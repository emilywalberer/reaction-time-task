  <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reaction Time Experiment & Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.0.1"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f7f6;
    }

    #welcome {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    #task {
      display: none;
      width: 100vw;
      height: 100vh;
      background: white;
      position: relative;
      overflow: hidden;
    }

    #circle {
      width: 100px;
      height: 100px;
      background: #ff4757;
      border-radius: 50%;
      position: absolute;
      display: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #circle:active {
      transform: scale(0.9);
    }

    #chart-container {
      display: none;
      width: 80%;
      max-width: 800px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    input {
      padding: 12px;
      margin: 15px 0;
      width: 80%;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    button {
      padding: 12px 24px;
      cursor: pointer;
      background: #2f3542;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }

    button:hover {
      background: #57606f;
    }

    h1 {
      color: #2f3542;
      margin-top: 0;
    }

    canvas {
      margin-top: 20px;
      max-height: 400px;
    }
  </style>
</head>

<body>

  <div id="welcome">
    <h1>Reaction Task</h1>
    <p>Enter your Participant ID to begin. If left blank, one will be assigned.</p>
    <input type="text" id="pID" placeholder="Participant ID">
    <br>
    <button onclick="startTask()">Start Experiment</button>
  </div>

  <div id="task">
    <div id="circle" onmousedown="handleCircleClick(event)"></div>
  </div>

  <div id="chart-container">
    <h1>Results vs. Community</h1>
    <p id="status-msg">Submitting and fetching community data...</p>
    <canvas id="resultsChart"></canvas>
    <br>
    <button onclick="resetExperiment()">Restart Task</button>
  </div>

  <script>
    // --- CONFIGURATION ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzN3ZCP3drh69fLtkFx1Ogct4qtcViXYoLnRdIEZE51EvbiPt9KIyksz3S1EGiZTmWD/exec";
    const TOTAL_TRIALS = 10;
    let trials = [];
    let count = 0;
    let startTime;
    let participantId;
    let chartInstance = null;

    function startTask() {
      participantId = document.getElementById('pID').value.trim() || "RAND_" + Math.random().toString(36).substr(2, 5).toUpperCase();
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('task').style.display = 'block';
      setTimeout(spawnCircle, 800);
    }

    function spawnCircle() {
      if (count >= TOTAL_TRIALS) return showVisualization();
      const circle = document.getElementById('circle');
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 120);
      circle.style.left = x + 'px';
      circle.style.top = y + 'px';
      circle.style.display = 'block';
      startTime = performance.now();
    }

    function handleCircleClick(e) {
      e.stopPropagation();
      const rt = Math.round(performance.now() - startTime);
      trials.push(rt);
      document.getElementById('circle').style.display = 'none';
      count++;
      if (count < TOTAL_TRIALS) {
        setTimeout(spawnCircle, 500);
      } else {
        showVisualization();
      }
    }
    async function showVisualization() {
      document.getElementById('task').style.display = 'none';
      document.getElementById('chart-container').style.display = 'block';
      const userAvg = trials.reduce((a, b) => a + b, 0) / trials.length;
      try {
        // POST Data to Web App
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({
            id: participantId,
            average: userAvg,
            raw: trials
          })
        });
        // GET Historical Data for Histogram
        const response = await fetch(WEB_APP_URL);
        const historicalData = await response.json();
        renderChart(historicalData, userAvg);
        document.getElementById('status-msg').innerText = "Your average: " + Math.round(userAvg) + "ms";
      } catch (err) {
        console.error("Data error:", err);
        document.getElementById('status-msg').innerText = "Finished! Average: " + Math.round(userAvg) + "ms (Offline mode)";
        renderChart([300, 350, 400, 450, 500, 320, 380], userAvg);
      }
    }

    function renderChart(data, userAvg) {
      const ctx = document.getElementById('resultsChart').getContext('2d');
      // Cleanup old chart if it exists
      if (chartInstance) {
        chartInstance.destroy();
      }
      
      // Fixed: Bins now go up to 1500ms
      const bins = [200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350, 1400, 1450, 1500];
      const binCounts = bins.map(b => data.filter(val => val >= b && val < b + 50).length);
      
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: bins.map(b => b + "ms"),
          datasets: [{
            label: 'Number of Participants',
            data: binCounts,
            backgroundColor: '#3498db'
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
              max: 10 // Fixed: Y-axis max set to 10
            }
          },
          plugins: {
            annotation: {
              annotations: {
                line1: {
                  type: 'line',
                  xMin: (userAvg - 200) / 50,
                  xMax: (userAvg - 200) / 50,
                  borderColor: '#ff4757',
                  borderWidth: 4,
                  label: {
                    display: true,
                    content: 'YOU (' + Math.round(userAvg) + 'ms)',
                    backgroundColor: '#ff4757'
                  }
                }
              }
            }
          }
        }
      });
    }

    function resetExperiment() {
      // Reset variables
      trials = [];
      count = 0;
      // Reset UI
      document.getElementById('chart-container').style.display = 'none';
      document.getElementById('welcome').style.display = 'block';
      document.getElementById('pID').value = "";
      document.getElementById('status-msg').innerText = "Submitting and fetching community data...";
    }
  </script>
</body>

</html>
    
  </body>
  
</html>
